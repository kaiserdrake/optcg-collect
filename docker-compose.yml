services:
  opcc-db:
    container_name: opcc-db
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env
    volumes:
      # Only database needs persistent storage
      - ${OPCC_DATA_PATH}/postgres:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    networks:
      - opcc-network

  opcc-scraper-api:
    container_name: opcc-scraper-api
    image: ghcr.io/kaiserdrake/optcg-scraper
    restart: always
    networks:
      - opcc-network

  opcc-backend:
    container_name: opcc-backend
    image: ghcr.io/kaiserdrake/opcc-backend:latest
    restart: always
    ports:
      - '3001:3001'
    env_file:
      - .env
    volumes:
      - ${OPCC_DATA_PATH}/cards:/usr/src/app/card-images
    user: "0:0"
    depends_on:
      - opcc-db
      - opcc-scraper-api
    networks:
      - opcc-network

  opcc-frontend:
    container_name: opcc-frontend
    image: ghcr.io/kaiserdrake/opcc-frontend:latest
    env_file:
      - .env
    restart: always
    ports:
      - '8086:3000'
    depends_on:
      - opcc-backend
    networks:
      - opcc-network

networks:
  opcc-network:
    driver: bridge
